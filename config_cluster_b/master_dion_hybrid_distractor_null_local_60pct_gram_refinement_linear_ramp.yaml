data_root_dir: /path/to/data/bacteria_PXD010000__PXD010613/annotated_regenerated_v3/
output_dir: /path/to/checkpoints/checkpoint
log_dir: /path/to/logs/log
embedding_dir: /path/to/runs/embeddings_cache
wandb_project: dion-pretraining
wandb_entity: user
log_wandb: 1
num_workers: 2
matmul_precision: high
precision: bf16-mixed

# Checkpointing
# Preserve every one of the 60 epoch-boundary refinement checkpoints for model selection.
save_top_k: 60
save_last: 1
every_n_epochs: 1

# Peak filtering
peak_filter_method: default
min_intensity: 0.0001
min_mz: 0
max_mz: 2500
max_length: 30
max_peaks: 200
# Downstream-only compatibility setting; DINO pretraining uses max_peaks above.
top_peaks: 150

# Include precursor charge/mass in encoder
use_mass: 1
use_charge: 1

# Max allowed precursor charge
max_charge: 10

# Models
encoder_model: encoder_larger_deeper
cls_token: 0
cross_attend: 1

#### Training hyperparameters
accum_iter: 1
batch_size: 128
scale_lr_by_batchsize: 0
seed: 0
accelerator: gpu
num_devices: 8
num_nodes: 8

# Tasks
pretrain: 1
encoder_weights:
pretrain_config: config_cluster_b/pretrain/dion_hybrid_distractor_null_local_60pct_gram_refinement_linear_ramp.yaml
pretraining_task: dion
probing_config: config_cluster_b/probing_tasks/embedding_probes_gram_refinement.yaml
probe_on_fit_start: 0
# Exactly one probe per 1,127-step training epoch, aligned with checkpoints.
probe_every_n_steps: 1127

# Downstream (not used for this pretrain run)
downstream_config: configs/downstream/sqa_default.yaml
downstream_task: none
downstream_encoder: last
downstream_root_dir: /path/to/data/SQA_dataset/dummy
downstream_weights:
limit_train_batches: 1.0
limit_val_batches: 100
num_sanity_val_steps: 0
validate_every_n_epochs: 1
