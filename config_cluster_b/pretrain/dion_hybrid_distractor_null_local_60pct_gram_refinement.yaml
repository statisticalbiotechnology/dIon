dion:
  dataset_name: bacteria
  # Data augmentation for DINO global loss and aligned global views for iBOT.
  selection_mode: "random_batched" # or "window", "random", "random_intensity_weighted", "random_intensity_weighted_batched"
  rand_window_size: false
  intensity_alpha: 1.0
  intensity_eps: 0.01
  # KEEP for the first causal Gram pilot: changing views would confound the
  # refinement test. Reconsider only in a separate post-pilot view ablation.
  global_crops_scale:
    - 0.95
    - 0.95
  local_crops_scale:
    - 0.6
    - 0.6
  num_global_crops: 2
  num_local_crops: 2

  # torch.compile experiments. Leave disabled by default: on GH200 this was
  # slower than eager mode for the current DINOv2 multi-crop shapes.
  # Fixed crop padding is only applied when compile_model is true, preserving
  # the default variable-length crop mode.
  compile_model: false
  compile_mode: "default"
  compile_strategy: "student_submodules"
  compile_backend:
  compile_fullgraph: false
  compile_dynamic: false
  compile_fixed_crop_padding: true
  fixed_crop_padding_max_peaks: 300

  # Hybrid H4/H26 objective. Teacher global crops remain clean and conditioned
  # on anchor A. Student globals independently mix equal-sized B subsets while
  # retaining A's precursor. Student local crops are clean 60% A subsets with
  # the reserved null precursor (charge=0, mass=0).
  mix_distractor_enabled: true
  mix_apply_to: "global_only"
  mix_distractor_sampling: "per_view"
  mix_strength_start: 1.0
  mix_strength_end: 1.0
  precursor_null_student_crops: "local"
  dino_student_group_weights:
    conditional_global: 0.5
    null_local: 0.5
  mix_warmup_duration: 0
  mix_condition_separation_ppm: 10.0
  mix_neutral_mass_separation_ppm: 10.0
  mix_merge_ppm: 5.0
  mix_intensity_normalization: "none"

  # DINO global head hparams. DINOv2's official DINOHead does not freeze
  # weight_g, so mlp_norm_last_layer stays false here.
  mlp_out_dim: 16384
  mlp_use_bn: false
  mlp_norm_last_layer: false
  mlp_nlayers: 3
  mlp_hidden_dim: 2048
  mlp_bottleneck_dim: 256

  # iBOT dense peak-token head hparams. Defaults mirror the DINO head.
  ibot_mlp_out_dim: 16384
  ibot_mlp_use_bn: false
  ibot_mlp_norm_last_layer: false
  ibot_mlp_nlayers: 3
  ibot_mlp_hidden_dim: 2048
  ibot_mlp_bottleneck_dim: 256

  # DINOv2 objective ablation: keep DINOv2 heads, Sinkhorn,
  # encoder_ld-matched schedules, and multi-crop wrapper, but disable dense
  # iBOT supervision, global student masking, and KoLeo. This isolates whether
  # KoLeo explains the remaining gap after removing iBOT.
  dino_loss_weight: 1.0
  ibot_loss_weight: 0.0
  koleo_loss_weight: 0.0
  ibot_mask_sample_probability: 0.0
  ibot_mask_ratio_min_max:
    - 0.0
    - 0.0

  # Teacher/student temperatures and target centering. Official DINOv2 exposes
  # train.centering as either "centering" or "sinkhorn_knopp"; the large
  # vitl14/vitg14 configs use Sinkhorn-Knopp. Temperature and teacher momentum
  # follow the successful W&B encoder_larger_deeper run user/dion-pretraining/39lvg1og.
  # DINOv2 converts warmup_teacher_temp_epochs to a per-step schedule.
  centering: "sinkhorn_knopp"
  sinkhorn_iterations: 3
  warmup_teacher_temp: 0.03
  teacher_temp: 0.07
  # Gram begins after the original DINO temperature warmup. Keep the continued
  # teacher target at its established 0.07 peak rather than re-warming it.
  warmup_teacher_temp_epochs: 0
  student_temp: 0.1
  center_momentum: 0.9
  ibot_warmup_teacher_temp: 0.03
  ibot_teacher_temp: 0.07
  ibot_warmup_teacher_temp_epochs: 10
  ibot_student_temp: 0.1
  ibot_center_momentum: 0.9
  # Continue the normal DINO EMA at the dIon-tested late-phase value. This
  # is deliberately a fixed momentum, not an EMA frozen at 1.0.
  teacher_momentum_start: 0.9986
  teacher_momentum_end: 0.9986
  teacher_momentum_cap: 0.9986
  pooling: "crossattend"

  # REFINEMENT DECISION REQUIRED: these controls define the optimizer/LR regime.
  # If gram_refinement_checkpoint_mode is weights_only, this schedule restarts
  # from refinement step 0. If it is resume, Lightning restores the checkpoint's
  # optimizer/scheduler state instead. Choose a short dIon pilot horizon and
  # revise all horizon-dependent values together; do not inherit these blindly.
  # Training hparams General. The old encoder_larger_deeper run logged
  # warmup_duration=20000 and decay_duration=75000, but its two-optimizer
  # scheduler path used trainer.global_step // 2. DINOv2 uses one optimizer, so
  # double step durations here to match the old logged LR-vs-epoch curve.
  schedule_mode: "indefinite"
  anneal_lr: true
  anneal_per_step: true
  warmup_duration: 0
  lr_start: 0
  blr: 4.5e-5
  lr_end: 4.5e-5
  decay_delay: 0
  decay_duration: 0
  # REFINEMENT DECISION REQUIRED: the master config's global batch_size overrides
  # this value when positive. Keep batch/ref_batch_size and LR scaling aligned.
  batch_size: 64
  ref_batch_size: 256
  weight_decay: 0.04
  # DINOv3 refined for 20% of pretraining. From epoch 279 last.ckpt, max_epochs 340
  # supplies 60 additional dIon epochs = 67,620 optimizer steps.
  epochs: 340
  # The master refinement job supplies the finite pilot horizon. Do not inherit
  # the original 250-epoch segment stop.
  stop_after_epoch:
  subset: 0
  num_workers: 2
  dropout: 0.15


  # ---------------------------------------------------------------------------
  # Gram refinement: NEW, deliberately disabled until every phase decision is
  # selected from dIon pilot evidence. Existing hybrid DINO fields above are
  # an exact hard copy of the 60%-local part-1 source configuration.
  # ---------------------------------------------------------------------------
  gram_enabled: true

  # Dense-good teacher: local-30 model at its ~120k global-step dense de novo
  # peak. The implementation loads only teacher.backbone weights, freezes it,
  # and keeps it separate from the normal DINO EMA teacher.
  gram_teacher_checkpoint: /path/to/checkpoints/DINO/bacteria/dinov2_hybrid_distractor_null_local30_300epochs_part1_resume_epoch49_maxpeaks200_bs128_64gpu_cluster_b/epoch=109_global_step~120k_dense_denovo_peak.ckpt

  # REQUIRED BEFORE ENABLING GRAM. This must agree with the CLI --resume:
  #   weights_only -> --resume 0; initialize model weights but deliberately use
  #                   a new refinement optimizer and schedule.
  #   resume       -> --resume 1; continue optimizer/scheduler state exactly.
  # The value is intentionally blank until this experimental choice is made.
  gram_refinement_checkpoint_mode: "resume"

  # REQUIRED BEFORE ENABLING GRAM. Tune on a short dIon pilot; this is added
  # to the complete hybrid-DINO loss and does not downweight that objective.
  gram_loss_weight: 2.0

  # REQUIRED BEFORE ENABLING GRAM. Measured from refinement start, not the old
  # 300-epoch clock; stored in refinement checkpoints across Slurm resumes.
  gram_warmup_steps: 1000
  gram_warmup_schedule: "cosine"

  # Keep 0 for the first causal experiment: use one existing clean conditioned
  # global crop exactly as sampled for the ordinary teacher. All valid physical
  # peak tokens enter each per-spectrum Gram matrix.
  gram_clean_crop_index: 0

  # First causal experiment intentionally uses a permanently frozen early
  # teacher. A later resume may enable the explicit hard-copy schedule below.
  gram_teacher_refresh: false
  # Relative to the point refresh is enabled, not the original pretraining clock.
  gram_teacher_refresh_first_step: 10000
  gram_teacher_refresh_every_n_steps: 10000
  gram_teacher_refresh_max_updates: 3

  # Fixed semantic invariants, not tuning knobs in the first causal experiment:
  # DINO-only (ibot_loss_weight above must stay 0), FP32 token normalization,
  # cosine Gram MSE, no negative-similarity clipping, valid physical peaks only,
  # and equal weighting of each spectrum's Gram loss.
  #
  # OPERATIONAL COMPANION: the master refinement config must set a much smaller
  # probe_every_n_steps than the original 6000-step cadence and retain mini-de
  # novo plus strict 10-ppm global evaluation during the pilot.
