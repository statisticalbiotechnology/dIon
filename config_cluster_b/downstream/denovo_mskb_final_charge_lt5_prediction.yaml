# Prediction-only de novo evaluation on the canonical MSKB-final held-out set
# restricted to precursor charge < 5 for Casanovo >= 5.2.1 comparability.
task: denovo
dataset_name: configurable_lance
tokenizer:
  source: numeric_mass_delta_manifest
  manifest: configs/tokenizers/pa11.json
  special_tokens:
    pad_token: X
    bos_token: <EOS>
    eos_token: <EOS>
    add_unk_token: false
top_peaks: 200
pep_length:
- 0
- 100
charge:
- 0
- 10
buffer_size: 10000
label_name: seq
precursor_mz_name: precursor_mz
precursor_mass_name: false
train_lance: train.lance
val_lance: val.lance
test_lance: test_charge_lt5_for_casanovo_v_gt_5_0/test.lance
denovo_tf:
  encoder_precursor_conditioning: conditioned
  gradient_clip_val: 2.0
  batch_size: 100
  decoder_dropout: 0.25
  max_length: 100
  reverse: true
  precursor_mass_tol: 50
  isotope_error_range:
  - 0
  - 1
  min_peptide_len: 6
  n_beams: 1
  top_match: 1
  calculate_precision: true
  train_label_smoothing: 0.0
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_steps: 6250
  cosine_period_steps: 149200
  epochs: 80
  checkpoint_monitor: denovo_tf_val_pep_prec
  checkpoint_mode: max
  # MztabOutputCallback writes one PSM row per test spectrum, including
  # peptide-level confidence in search_engine_score[1] and ground truth.
  log_predictions: true
metadata_columns:
- peak_file
- scan_id
- title
