# Literal copy of the proven 200-peak Kingdoms prediction recipe for oracle-
# precursor DIA mixture decoding. All source splits are provenance only;
# all_splits_test.lance is the selected-model union evaluation table.
task: denovo
dataset_name: configurable_lance
tokenizer:
  source: numeric_mass_delta_manifest
  manifest: configs/tokenizers/pa11.json
  special_tokens:
    pad_token: X
    bos_token: <EOS>
    eos_token: <EOS>
    add_unk_token: false
top_peaks: 200
pep_length:
- 0
- 100
charge:
- 0
- 10
buffer_size: 10000
label_name: seq
precursor_mz_name: precursor_mz
precursor_mass_name: false
# Eval-only construction still requires train/val paths; neither is executed.
train_lance: train.lance
val_lance: val.lance
test_lance: all_splits_test.lance
denovo_tf:
  encoder_precursor_conditioning: conditioned
  gradient_clip_val: 2.0
  batch_size: 100
  decoder_dropout: 0.25
  max_length: 100
  reverse: true
  precursor_mass_tol: 50
  isotope_error_range:
  - 0
  - 1
  min_peptide_len: 6
  n_beams: 1
  top_match: 1
  calculate_precision: true
  train_label_smoothing: 0.0
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_steps: 6250
  cosine_period_steps: 149200
  epochs: 80
  checkpoint_monitor: denovo_tf_val_pep_prec
  checkpoint_mode: max
  # Persistent exact-index CSV output; requires the fields below.
  log_predictions: true
  prediction_table: true
  exact_eval_sharding: true
  # Distributed-safe Casanovo-matched counts and metrics for every species.
  # This target-query dataset has no species field; retain exact sharding and CSV output.
  log_species_metrics: false
metadata_columns:
- peak_file
- scan_id
- title
- split
- source_row_index
- isolation_low
- isolation_high
