# Standard downstream SupCon fine-tuning. Supply --encoder_weights for SSL
# initialization; leave it empty for matched random/scratch initialization.
data_root_dir:
downstream_root_dir: /path/to/data/bacteria_PXD010000__PXD010613/annotated_regenerated_v3
output_dir: /path/to/checkpoints/metric_learning/bacterial
log_dir: /path/to/project/logs/metric_learning/bacterial
wandb_project: dion-pretraining
wandb_entity: null
log_wandb: 1
num_workers: 8
precision: bf16-mixed
matmul_precision: high

save_top_k: 1
save_last: 1
every_n_epochs: 1

# Match hybrid DINO preprocessing and input conditioning.
peak_filter_method: default
intensity_scaling: minmax
min_intensity: 0.0001
min_mz: 0
max_mz: 2500
max_peaks: 200
use_mass: 1
use_charge: 1
max_charge: 10
precursor_conditioning: conditioned

encoder_model: encoder_larger_deeper
decoder_model: metric_projection_head
cls_token: 0
cross_attend: 1
pretraining_task: dion
pretrain_config: configs/pretrain/dion_hybrid_distractor_null_local_100pct.yaml
encoder_weights:
pretrain: 0
freeze_encoder: 0

batch_size: -1
accum_iter: 1
scale_lr_by_batchsize: 0
seed: 0
# Fixed budget for every label fraction and initialization in the first array.
max_steps: 40000
early_stop: 20
accelerator: gpu
num_devices: 1
num_nodes: 1
strategy: ddp
clip_grad: 1.0

# The 10% identity budget is the default. Override this path with
# --downstream_train_path for 1% or 100%.
downstream_config: configs/downstream/metric_learning_bacterial.yaml
downstream_task: metric_learning
downstream_weights:
limit_train_batches: 1.0
limit_val_batches: 1.0
limit_test_batches: 1.0
validate_every_n_epochs: 1
validate_on_end: 0
test_on_end: 0
