# Frozen linear scalar-regression retention-time diagnostic probe.
data_root_dir:
output_dir: /path/to/checkpoints/checkpoint
log_dir: /path/to/project/logs/log
embedding_dir: /path/to/project/embeddings_cache
wandb_project: ms2-auxiliary
wandb_entity: null
log_wandb: 1
num_workers: 8
matmul_precision: high
precision: bf16-mixed

# Checkpointing
save_top_k: 1
save_last: 1
every_n_epochs: 1

# Match the hybrid encoder's peak-filtering regime.
peak_filter_method: default
min_intensity: 0.0001
min_mz: 0
max_mz: 2500
max_length: 30
max_peaks: 200
top_peaks: 150

# Hybrid DINO encoder input contract.
use_mass: 1
use_charge: 1
max_charge: 10
precursor_conditioning: conditioned

# Models
encoder_model: encoder_larger_deeper
decoder_model: linear_regression_head
cls_token: 0
cross_attend: 1

# Downstream training
accum_iter: 1
batch_size: -1
scale_lr_by_batchsize: 0
seed: 0
accelerator: gpu
num_devices: 1
num_nodes: 1
freeze_encoder: 1

# Load the trained hybrid wrapper solely to obtain its pooled embedder.
pretrain: 0
encoder_weights: /path/to/checkpoints/important/DINO/bacteria/dinov2_hybrid_distractor_null_local_maxpeaks200_bs128_64gpu_cluster_b_epoch100/last.ckpt
pretrain_config: configs/pretrain/dion_hybrid_distractor_null_local_100pct.yaml
pretraining_task: dion

# Retention-time benchmark with run- and peptide-disjoint splits.
downstream_config: configs/downstream/retention_time_regression_probe.yaml
downstream_task: retention_time
downstream_root_dir: /path/to/work/datasets/auxiliary_benchmarks_lance_v1/retention_time
downstream_weights:
limit_train_batches: 1.0
limit_val_batches: 1.0
limit_test_batches: 1.0
validate_every_n_epochs: 1
validate_on_end: 0
test_on_end: 1
