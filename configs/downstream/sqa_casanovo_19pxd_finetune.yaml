# Full-finetuning SQA screening recipe for the balanced 19-PXD corpus.
task: sqa
dataset_name: sqa
top_peaks: 150
sqa:
  checkpoint_monitor: val_auc
  checkpoint_mode: max
  anneal_lr: true
  anneal_per_step: false
  lr_start: 1.0e-11
  # The scheduler uses head_lr; encoder lr is maintained through lr_scale.
  blr: 5.0e-4
  head_lr: 5.0e-4
  encoder_lr: 1.0e-5
  lr_end: 1.0e-5
  warmup_duration: 2
  decay_delay: 0
  decay_duration: 18
  batch_size: 128
  ref_batch_size: 128
  label_smoothing: 0
  weight_decay: 0
  epochs: 20
  subset: 0
  decoder_dropout: 0
