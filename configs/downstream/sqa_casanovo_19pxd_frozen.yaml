# Frozen-representation SQA screening recipe for the balanced 19-PXD corpus.
task: sqa
dataset_name: sqa
top_peaks: 150
sqa:
  checkpoint_monitor: val_auc
  checkpoint_mode: max
  anneal_lr: true
  anneal_per_step: false
  lr_start: 1.0e-11
  # head_lr is the scheduler reference LR. blr is retained for compatibility.
  blr: 5.0e-4
  head_lr: 5.0e-4
  lr_end: 1.0e-4
  warmup_duration: 2
  decay_delay: 0
  decay_duration: 6
  batch_size: 128
  ref_batch_size: 128
  label_smoothing: 0
  weight_decay: 0
  epochs: 8
  subset: 0
  decoder_dropout: 0
