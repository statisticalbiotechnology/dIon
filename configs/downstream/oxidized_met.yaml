# Hard copy of configs/downstream/sqa_casanovo_19pxd_finetune.yaml.
task: oxidized_met
dataset_name: auxiliary_lance
top_peaks: 150

oxidized_met:
  checkpoint_monitor: val_auc
  checkpoint_mode: max
  anneal_lr: true
  anneal_per_step: true
  lr_start: 1.0e-11
  # The scheduler uses head_lr; encoder lr is maintained through lr_scale.
  blr: 5.0e-4
  head_lr: 5.0e-4
  encoder_lr: 1.0e-5
  lr_end: 1.0e-5
  warmup_duration: 500
  decay_delay: 0
  decay_duration: 60000
  batch_size: 128
  ref_batch_size: 128
  label_smoothing: 0
  weight_decay: 0
  epochs: 60
  subset: 0
  decoder_dropout: 0
  target_column: label
  evaluation_mask_column: matched_backbone
