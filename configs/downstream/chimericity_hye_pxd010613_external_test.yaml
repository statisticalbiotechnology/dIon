# Hard copy of chimericity_hye.yaml with PXD010613 as external test only.
task: chimericity
dataset_name: auxiliary_lance
top_peaks: 150
train_lance: /path/to/work/datasets/auxiliary_benchmarks_lance_v1/chimericity_hye/train.lance
val_lance: /path/to/work/datasets/auxiliary_benchmarks_lance_v1/chimericity_hye/val.lance
test_lance: /path/to/work/datasets/auxiliary_benchmarks_lance_v1/chimericity_pxd010613/test.lance

chimericity:
  checkpoint_monitor: val_auc
  checkpoint_mode: max
  anneal_lr: true
  anneal_per_step: false
  lr_start: 1.0e-11
  blr: 5.0e-4
  head_lr: 5.0e-4
  encoder_lr: 1.0e-5
  lr_end: 1.0e-5
  warmup_duration: 2
  decay_delay: 0
  decay_duration: 18
  batch_size: 128
  ref_batch_size: 128
  label_smoothing: 0
  weight_decay: 0
  epochs: 20
  subset: 0
  decoder_dropout: 0
  target_column: label
