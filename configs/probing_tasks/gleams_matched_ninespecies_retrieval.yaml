# Shared DINO/GLEAMS corpus after GLEAMS charge and preprocessing filtering.
# Build it with export_external_embedding_input.py, embed_gleams_benchmark.py,
# and materialize_external_matched_retrieval.py. Do not apply a new subset.
embedding_evaluation:
  name: ninespecies_v2_gleams_matched_peptide_retrieval
  dataset:
    parquet_path: /path/to/data/probing_datasets/gleams_matched/ninespecies_v2_peptide_retrieval.parquet
    peptide_id_column: peptide_id
    partition_column: species
  selection:
    seed: 0
    max_peptides_per_partition:
    max_spectra_per_peptide:
  extraction:
    batch_size: 256
    num_workers: 2
    pin_memory: true
    show_progress: true
  metrics_device: model
  retrieval:
    enabled: true
    metric: cosine
    ks: [1, 5, 10]
    query_seed: 0
    query_batch_size: 128
    show_progress: true
  mass_controlled_retrieval:
    enabled: true
    ppm_tolerance: 10.0
  cross_charge_retrieval:
    enabled: true
    neutral_mass_ppm_tolerance: 10.0
  compactness:
    enabled: true
    seed: 0
    max_between_samples: 1000
    show_progress: true
    silhouette:
      enabled: false
      max_samples: 3000
      seed: 0
  output:
    write_report: true
    report_tag: dino_on_gleams_matched
    report_path:
    print_report: true
  online:
    enabled: false
    on_fit_start: false
