embedding_evaluation:
  name: kingdoms_peptide_retrieval
  dataset:
    parquet_path: /path/to/data/probing_datasets/kingdoms_peptide_retrieval.parquet
    # Use peptide sequence first. The generated corpus also retains peptide_ion_id
    # for a separate charge-conditioned analysis.
    peptide_id_column: peptide_id
    partition_column: species
  selection:
    seed: 0
    max_peptides_per_partition: 188
    max_spectra_per_peptide: 10
  extraction:
    batch_size: 256
    num_workers: 2
    pin_memory: true
    show_progress: true
  metrics_device: model
  retrieval:
    enabled: true
    metric: cosine
    ks: [1, 5, 10]
    query_seed: 0
    query_batch_size: 128
    show_progress: true
  mass_controlled_retrieval:
    enabled: true
    ppm_tolerance: 10.0
  cross_charge_retrieval:
    enabled: true
    neutral_mass_ppm_tolerance: 10.0
  compactness:
    enabled: true
    seed: 0
    max_between_samples: 1000
    show_progress: true
    silhouette:
      enabled: false
  output:
    write_report: true
    report_path:
    report_tag: kingdoms
    print_report: true
  online:
    enabled: false
    on_fit_start: false
    overrides:
      selection:
        max_peptides_per_partition: 50
      extraction:
        show_progress: false
      retrieval:
        show_progress: false
      compactness:
        show_progress: false
      output:
        write_report: false
        print_report: false
