# Shared DINO/GLEAMS static pairs after GLEAMS preprocessing filtering and
# deterministic 1:1 rebalancing. Build with the external pair scripts.
pair_discrimination_evaluation:
  name: ninespecies_v2_gleams_matched_peptide_ion_pairs
  dataset:
    spectra_path: /path/to/data/probing_datasets/gleams_matched/ninespecies_v2_peptide_ion_pairs/spectra.parquet
    pairs_path: /path/to/data/probing_datasets/gleams_matched/ninespecies_v2_peptide_ion_pairs/pairs.parquet
    manifest_path: /path/to/data/probing_datasets/gleams_matched/ninespecies_v2_peptide_ion_pairs/manifest.json
  selection:
    seed: 0
    max_pairs_per_partition_per_label:
  extraction:
    batch_size: 256
    num_workers: 2
    pin_memory: true
    show_progress: true
  metrics_device: model
  pair_metrics:
    metric: cosine
    balanced_pair_fdr_levels: [0.01, 0.05, 0.10]
    purity_coverage_levels: [0.01, 0.05, 0.10, 0.25, 0.50, 0.75, 1.0]
  output:
    write_report: true
    report_tag: dino_on_gleams_matched
    report_path:
    print_report: true
  online:
    enabled: false
    on_fit_start: false
