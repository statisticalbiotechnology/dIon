null_local_consistency_evaluation:
  # Locked NineSpecies V2 development data. This validates the Hybrid-300
  # null-local objective; it is not final held-out reporting.
  retrieval_config_path: configs/probing_tasks/ninespecies_v2_paper_validation_retrieval.yaml
  seed: 20260818
  max_pairs_per_partition: 500
  extraction:
    batch_size: 128
    num_workers: 0
    pin_memory: true
  # This is only the different-peptide control selection policy. The input to
  # both local views remains A alone: no distractor peaks are mixed.
  pair_eligibility:
    condition_separation_ppm: 10.0
    neutral_mass_separation_ppm: 10.0
    merge_ppm: 5.0
  output:
    report_path:
