# Canonical candidates and cohorts for offline representation evaluation.
# Add a future checkpoint here; do not fork a submission script per checkpoint.
models:
  random_hybrid:
    kind: random_dino
    description: Architecture-matched seeded random DINOv2 global representation.
    master_config: configs/master_dion_hybrid_distractor_null_local.yaml
    pretrain_config: configs/pretrain/dion_hybrid_distractor_null_local_100pct.yaml
    pretraining_task: dion
    embedding_readout: backbone
    conditioning_modes: [conditioned, "null"]
    random_seed: 0
    preprocessing:
      max_peaks: 200
      use_mass: 1
      use_charge: 1
      use_energy: 0
      max_charge: 10
      peak_filter_method: default
      intensity_scaling: basepeak
      min_mz: 0
      max_mz: 2500
      min_intensity: 0.0001
      min_peaks: 0
      remove_precursor_tol: 2.0

