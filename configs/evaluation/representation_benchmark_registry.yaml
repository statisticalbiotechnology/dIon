cohorts:
  primary:
    validation:
      status: ready
      ninespecies_v2:
        retrieval_config: configs/probing_tasks/ninespecies_v2_paper_validation_retrieval.yaml
        pair_config: configs/probing_tasks/ninespecies_v2_paper_validation_pairs.yaml
      bacterial:
        retrieval_config: configs/probing_tasks/bacterial_paper_validation_retrieval.yaml
        pair_config: configs/probing_tasks/bacterial_paper_validation_pairs.yaml
      kingdoms:
        retrieval_config: configs/probing_tasks/kingdoms_paper_validation_retrieval.yaml
        pair_config: configs/probing_tasks/kingdoms_paper_validation_pairs.yaml
    locked_test:
      status: ready
      ninespecies_v2:
        retrieval_config: configs/probing_tasks/ninespecies_v2_paper_test_retrieval.yaml
        pair_config: configs/probing_tasks/ninespecies_v2_paper_test_pairs.yaml
